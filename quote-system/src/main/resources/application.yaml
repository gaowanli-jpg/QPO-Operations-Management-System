server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: quote-system
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      encoding: UTF-8
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
    map-underscore-to-camel-case: true

erp:
  upload-dir: ${ERP_UPLOAD_DIR:D:/ERP_Files/}
  backup-dir: ${ERP_BACKUP_DIR:D:/ERP_Files/backup/}
  cors:
    allowed-origins: ${ERP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4173}
  auth:
    enabled: ${ERP_AUTH_ENABLED:true}
