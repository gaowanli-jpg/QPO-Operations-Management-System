server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: quote-backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:3000}
      connection-init-sql: SET TIME ZONE 'Asia/Shanghai'
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      encoding: UTF-8
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
    map-underscore-to-camel-case: true

erp:
  upload-dir: ${ERP_UPLOAD_DIR:D:/ERP_Files/}
  backup-dir: ${ERP_BACKUP_DIR:D:/ERP_Files/backup/}
  public-base-url: ${ERP_PUBLIC_BASE_URL:http://localhost:8088}
  cors:
    allowed-origins: ${ERP_CORS_ALLOWED_ORIGINS:http://localhost:8088,http://127.0.0.1:8088,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173}
  auth:
    enabled: ${ERP_AUTH_ENABLED:true}
    jwt-secret: ${ERP_JWT_SECRET:change-this-secret-before-production}
    jwt-ttl-minutes: ${ERP_JWT_TTL_MINUTES:720}
  # Legacy APS source outlet only; new downstream integrations use MES/WMS/U9.
  aps:
    source-token: ${ERP_APS_SOURCE_TOKEN:}
  u9:
    base-url: ${ERP_U9_BASE_URL:}
    auth-login-path: ${ERP_U9_AUTH_LOGIN_PATH:/webapi/OAuth2/AuthLogin}
    sales-order-create-path: ${ERP_U9_SALES_ORDER_CREATE_PATH:/webapi/SO/Create}
    user-code: ${ERP_U9_USER_CODE:}
    ent-code: ${ERP_U9_ENT_CODE:}
    org-code: ${ERP_U9_ORG_CODE:}
    client-id: ${ERP_U9_CLIENT_ID:}
    client-secret: ${ERP_U9_CLIENT_SECRET:}
    connect-timeout-ms: ${ERP_U9_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${ERP_U9_READ_TIMEOUT_MS:30000}
  mes:
    base-url: ${ERP_MES_BASE_URL:}
    auth-token: ${ERP_MES_AUTH_TOKEN:}
    material-path: ${ERP_MES_MATERIAL_PATH:/api/mes/materials/resolve}
    production-path: ${ERP_MES_PRODUCTION_PATH:/api/mes/production/submit}
    timeout-ms: ${ERP_MES_TIMEOUT_MS:10000}
    callback-token: ${ERP_MES_CALLBACK_TOKEN:}
    callback-token-enabled: ${ERP_MES_CALLBACK_TOKEN_ENABLED:true}
  wms:
    base-url: ${ERP_WMS_BASE_URL:}
    auth-token: ${ERP_WMS_AUTH_TOKEN:}
    allocation-path: ${ERP_WMS_ALLOCATION_PATH:/api/wms/inventory/allocate}
    timeout-ms: ${ERP_WMS_TIMEOUT_MS:10000}
  task:
    core-pool-size: ${ERP_TASK_CORE_POOL_SIZE:2}
    max-pool-size: ${ERP_TASK_MAX_POOL_SIZE:4}
    queue-capacity: ${ERP_TASK_QUEUE_CAPACITY:50}
    output-dir: ${ERP_TASK_OUTPUT_DIR:D:/ERP_Files/tasks/}
